[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "au42-spt-analysis"
version = "1.0.0"
description = "Trajectory analysis for long-term NIR single-particle tracking with Au42(PET)32 gold quantum needles: particle linking, DC-MSS motion classification, and directional-correlation analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
keywords = [
    "single-particle tracking",
    "SPT",
    "DC-MSS",
    "moment scaling spectrum",
    "directional correlation",
    "near-infrared imaging",
    "gold nanocluster",
]
authors = [
    { name = "Shunsuke Yagi" },
    { name = "Shinjiro Takano" },
    { name = "Ryo Nishiyama" },
    { name = "Ryosuke Oketani" },
    { name = "Tatsuya Tsukuda" },
    { name = "Kotaro Hiramatsu" },
]
maintainers = [
    { name = "Shunsuke Yagi", email = "@" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy==2.3.3",
    "scipy==1.16.1",
    "pandas==2.2.3",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
# Needed only to re-run analysis/linking/s2_intensity.py from the raw image
# stack, which is not distributed with this repository.
images = ["tifffile==2025.6.11"]

[project.urls]
Preprint = "https://doi.org/10.64898/2026.06.24.734378"
Repository = "https://github.com/ShunsukeNefYagi/Anachem2026"

# The analysis is a set of ordered scripts, not an importable library. Nothing is
# installed onto sys.path; `pip install -r requirements.txt` is the intended route
# and this file exists to pin the environment and carry citation metadata.
[tool.setuptools]
packages = []
